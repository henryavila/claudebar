# claudebar config v1
#
# All options shown with defaults, commented out.
# Uncomment and change only what you want.
# Recompiles automatically on next statusline render.
#
# Docs: https://github.com/henryavila/claudebar

[layout]
# force = "auto"
# refresh_interval = 30

[chips]
# model = true
# effort = true
# tmux = true
# repo = true
# branch = true
# worktree = true
# dirty = true
# pr = true
# agent = true
# ctx_bar = true
# five_hour_bar = true
# seven_day_bar = true
# countdown = true
# time_marker = true
# update = true
# project = true            # desktop-only focus chip; no-op when .atomic-skills/focus.json is absent

[thresholds]
# warning = 60
# critical = 90

[colors]
# model = 213
# model_dim = 240
# effort_low = 76
# effort_med = 39
# effort_high = 220
# effort_xhigh = 208
# effort_max = 197
# repo = 245
# worktree = 147
# branch = 76
# dirty = 178
# clean = 82
# pr_pending = 220
# pr_approved = 82
# pr_changes = 196
# pr_draft = 240
# bar_green = 76
# bar_yellow = 220
# bar_red = 196
# bar_dim = 238
# agent = 141
# tmux = 105
# separator = 238
# update = 220
# project = 39             # focus chip (fresh)
# project_stale = 244      # focus chip when a source drifted (dim "~")
# project_blocked = 220    # focus chip when a task is blocked

[glyphs]
# sparkle = "✦"
# pencil = ""
# git = ""
# pr = ""
# tmux = ""
# gear = ""
# worktree = "⎇"
# update = "⬆"
# project = ""           # focus chip leader (nf-fa-dot-circle-o)
# drift = "⌁"             # completion-drift marker on the focus chip
# multiplan = ""          # >1 active plan marker (nf-fa-clone)

[update]
# Auto-update mode (checked once per session, throttled, in the background):
#   "patch" — auto-apply hotfixes (1.1.x) only; minor/major just notify  [default]
#   "all"   — auto-apply every newer release
#   "off"   — never check or update
# auto_update = "patch"
# auto_update_interval_hours = 24

[daemon]
# Hook-independent OS self-heal backstop (launchd on macOS, systemd --user on
# Linux/WSL, cron/profile fallback). It re-injects the statusLine + hooks even
# when Claude Code rewrites settings.json and drops the heal hook entirely.
# Default: on. Set to false to opt out — `uninstall` removes any registered
# daemon, and `install --no-daemon` skips registering it.
# enabled = true
